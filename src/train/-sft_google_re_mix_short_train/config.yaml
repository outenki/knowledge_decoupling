base:
  path: /lustre1/work/c30897/wtq/projects/knowledge_decoupling
model:
  config: meta-llama/Llama-3.2-1B
  init_model: ''
  checkpoint: null
  freeze_layers: 0
data:
  name: google_re_mix_short
  paths:
  - ${base.path}/input/tokenized/${model.config}/sft/concat/${data.name}/train
  limits:
  - 0
  shuffle: true
training:
  epochs: 3
  batch_size: 4
  learning_rate: 5.0e-05
  eval_strategy: 'no'
  checkpoints_per_epoch: 1
  save_checkpoints_num: 1
  attn_implementation: sdpa
wandb:
  group: ${model.config}_sft
  tags:
  - sft
output:
  path: ${model.init_model}-sft_${data.name}_train
