# configs/train.yaml
base:
  path: null

model:
  config: HuggingFaceTB/SmolLM2-135M
  init_model: null
  checkpoint: null
  freeze_layers: 0

data:
  name: SmolLM2-135M-20B-core-bs1024
  paths:
    - ${base.path}/input/tokenized/${model.config}/train/${data.name}
  limits:
    - 0
  shuffle: true

training:
  epochs: 1
  batch_size: 32
  learning_rate: 2e-4
  eval_strategy: "no"
  checkpoints_per_epoch: 10
  save_checkpoints_num: 10
  attn_implementation: "sdpa"

wandb:
  group: test
  tags:
    - train
    - SmolLM2-135M
    - core
    - sml
    - bs1024

output:
  path: ${base.path}/output/test/${model.config}/${data.name}/

hydra:
  run:
    dir: ${output.path}