# configs/train.yaml
# 48.05M
seed: null
base:
  path: null

model:
  config: meta-llama/Llama-3.2-1B
  # tokenizer: meta-llama/Llama-3.2-1B
  tokenizer: ${base.path}/input/tokenized/${model.config}/train/${data.name}/tokenizer
  init_model: null
  checkpoint: null
  freeze_layers: 0
  architecture:
    num_hidden_layers: 16
    hidden_size: 256
    intermediate_size: 1024
    num_attention_heads: 4
    num_key_value_heads: 1
    tie_word_embeddings: true

data:
  name: SmolLM2-135M-20B-sml-bs4096
  paths:
    - ${base.path}/input/tokenized/${model.config}/train/${data.name}
  limits:
    - 0
  shuffle: true

training:
  skip: false
  epochs: 1
  batch_size: 4
  learning_rate: 2e-4
  eval_strategy: "no"
  checkpoints_per_epoch: 10
  save_checkpoints_num: 10
  attn_implementation: "sdpa"

wandb:
  group: Llama-3.2
  tags:
    - train
    - Llama-3.2
    - sml
    - bs4096

output:
  path: ${base.path}/output/${model.config}/seed_${seed}/no_warmup/${model.architecture.num_hidden_layers}x${model.architecture.hidden_size}/${data.name}

hydra:
  run:
    dir: ${output.path}