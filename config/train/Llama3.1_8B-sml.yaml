# configs/train.yaml
seed: null
base:
  path: null

model:
  config: meta-llama/Llama-3.1-8B
  tokenizer: ${base.path}/input/tokenized/${model.config}/train/${data.name}/tokenizer
  init_model: null
  checkpoint: null
  freeze_layers: 0

data:
  name: SmolLM2-135M-20B-sml-bs4096
  paths:
    - ${base.path}/input/tokenized/${model.config}/train/${data.name}
  limits:
    - 0
  shuffle: true

training:
  epochs: 1
  batch_size: 1
  learning_rate: 2e-4
  eval_strategy: "no"
  checkpoints_per_epoch: 10
  save_checkpoints_num: 10
  attn_implementation: "sdpa"

wandb:
  group: Llama-3.1-8B-sml
  tags:
    - train
    - Llama-3.1-8B
    - sml
    - bs4096

output:
  path: ${base.path}/output/${model.config}/seed_${seed}/no_warmup/${data.name}

hydra:
  run:
    dir: ${output.path}