# @package _global_
# Shared settings for the Llama 3.2 1B SML / RND_ID / MASK comparisons.
seed: null
base:
  path: null

model:
  config: meta-llama/Llama-3.2-1B
  tokenizer: ${base.path}/input/tokenized/${model.config}/train/${data.name}/tokenizer
  init_model: null
  checkpoint: null
  freeze_layers: 0

data:
  paths:
    - ${base.path}/input/tokenized/${model.config}/train/${data.name}
  limits:
    - 0
  shuffle: true

training:
  epochs: 1
  batch_size: 4
  learning_rate: 2e-4
  eval_strategy: "no"
  checkpoints_per_epoch: 10
  save_checkpoints_num: 10
  attn_implementation: "sdpa"

output:
  path: ${base.path}/output/${model.config}/seed_${seed}/no_warmup/${data.name}

hydra:
  run:
    dir: ${output.path}
