# https://huggingface.co/datasets/google/boolq
task: google_boolq_rnd_id
dataset_path: json
dataset_kwargs:
  data_files:
    train: /home/pj24001974/ku50001571/projects/knowledge_decoupling/input/evaluate_data/jsonl/google_boolq_rnd_id/train.jsonl
    validation: /home/pj24001974/ku50001571/projects/knowledge_decoupling/input/evaluate_data/jsonl/google_boolq_rnd_id/validation.jsonl
output_type: multiple_choice
training_split: train
validation_split: validation
test_split: null
process_docs: !function utils.process_docs
# doc_to_text: "Background: {{passage}}\n\nQuestion: {{question}}?\n\nAnswer:"
doc_to_text: "{{prompt}}"
doc_to_target: target
doc_to_choice: ["no", "yes"]
should_decontaminate: true
doc_to_decontamination_query: passage

metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
  - metric: f1
    higher_is_better: true
    aggregation: !function metrics.micro_f1_score
metadata:
  version: 1.0